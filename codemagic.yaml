workflows:
  ios-personal-build:
    name: 每日打卡 iPhone App
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: DailyCheckIn.xcodeproj
        APP_NAME: DailyCheckIn
    scripts:
      - name: Build unsigned iOS app
        script: |
          set -e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            SUPPORTED_PLATFORMS=iphoneos \
            SDKROOT=iphoneos \
            TARGETED_DEVICE_FAMILY="1,2" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            GENERATE_INFOPLIST_FILE=YES \
            SUPPORTS_MACCATALYST=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qr "$APP_NAME.ipa" Payload
    artifacts:
      - build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
